# Strategy context passed to Claude on every analysis run.
# Edit this file to reflect your current portfolio positioning,
# investment themes, and what you want the agent to flag.

portfolio:
  style: "concentrated momentum equity — alpha quant, high conviction"
  horizon: "5-21 day holding period"
  universe: "US large-cap and mid-cap equities"

  # Tickers currently winning / high-conviction watchlist.
  # The agent will flag any research item that mentions these.
  watchlist:
    - AVGO       # AI networking supercycle — multi-gigawatt data center contracts
    - NVDA       # GPU dominance, Blackwell ramp
    - MSFT       # Azure AI, Anthropic/OpenAI partner ecosystem
    - VST        # Power/nuclear — AI energy nexus
    - TLN        # Nuclear energy — power contracts for AI data centers
    - MU         # HBM memory supercycle, AI training demand
    - META       # AI capex beneficiary, Llama moat
    - GOOGL      # Gemini inference, TPU ramp
    - AMZN       # AWS AI infrastructure
    - LMT        # Defense supercycle — geopolitical risk premium
    - NOC        # Defense — same thesis as LMT
    - GD         # Defense — same thesis
    - SPY        # Market regime
    - QQQ        # Tech breadth proxy

themes:
  - name: ai_energy_nexus
    description: "Power demand from AI data centers — nuclear, natural gas, grid infrastructure"
    keywords:
      - nuclear power
      - data center power
      - AI electricity demand
      - power purchase agreement
      - grid capacity
      - Constellation Energy
      - Vistra
      - Talen Energy
      - SMR
      - small modular reactor
      - gigawatt

  - name: ai_infrastructure
    description: "AI compute, GPU supply chain, custom silicon, HBM memory, inference"
    keywords:
      - AI infrastructure
      - GPU
      - inference compute
      - data center
      - Blackwell
      - H100
      - HBM
      - custom silicon
      - ASIC
      - multi-gigawatt
      - hyperscaler capex
      - AI capex

  - name: defense_supercycle
    description: "Global defense spending ramp — NATO commitments, Ukraine, Indo-Pacific"
    keywords:
      - defense budget
      - NATO spending
      - Ukraine war
      - defense contract
      - F-35
      - hypersonic
      - missile defense
      - military spending
      - defense authorization

  - name: earnings_catalyst
    description: "Imminent earnings beats, guidance raises, analyst upgrades"
    keywords:
      - earnings surprise
      - EPS beat
      - guidance raised
      - analyst upgrade
      - revenue beat
      - margin expansion
      - backlog growth

  - name: macro_regime
    description: "Fed policy, tariff impacts, yield curve — regime-shifting macro signals only"
    keywords:
      - Federal Reserve
      - interest rate cut
      - tariff
      - trade war
      - credit spread
      - recession risk
      - FOMC

scoring:
  # Relative weights Claude uses when ranking items.
  # Must sum to 1.0.
  watchlist_mention: 0.35     # Item mentions a watchlist ticker
  theme_relevance: 0.35       # Item is strongly on-theme
  signal_novelty: 0.20        # New information not seen before
  source_credibility: 0.10    # Quality of the source

  # Items with a total score below this threshold are excluded from the digest.
  min_score_threshold: 0.40

digest:
  max_items_per_theme: 5
  max_total_items: 20
  include_arxiv: true
  include_earnings: true
  include_macro: true
  include_news: true

scoring_calibration:
  description: >
    Scores must reflect actionability for a 3-10 day holding horizon,
    not fundamental quality alone. A great company is not automatically
    a high-score signal. Score the CHANGE or CATALYST, not the stock.

  bands:
    0.90_to_1.00: >
      Reserve for items with an imminent, specific, time-bound catalyst
      directly affecting a watchlist ticker within 1-5 trading days.
      Example: earnings beat announced today, guidance raised, M&A confirmed.
      Strong fundamentals alone NEVER justify this band.

    0.70_to_0.89: >
      Clear directional signal with moderate urgency. Relevant to a watchlist
      ticker with a thesis that has a defined time horizon. Earnings snapshots
      with strong YoY growth but no new catalyst belong here, not above 0.90.

    0.50_to_0.69: >
      Relevant research or context that informs strategy but requires
      additional confirmation. Academic papers, macro series, indirect
      readthroughs. Worth monitoring, not acting on immediately.

    0.30_to_0.49: >
      Tangentially relevant. Background context only. No immediate
      portfolio implication.

    below_0.30: >
      Not relevant to this strategy. Filter out entirely.

  penalties:
    - "Static fundamental snapshots (P/E, revenue) with no new catalyst: cap at 0.85"
    - "Academic papers without direct signal: cap at 0.65"
    - "Indirect ticker readthroughs (not on watchlist): cap at 0.75"
    - "Macro series with no regime change: cap at 0.65"
    - "Crypto, commodities, micro-cap: score <= 0.20 regardless of content"

  bonuses:
    - "Earnings surprise announced TODAY for watchlist ticker: +0.10"
    - "Guidance raised for watchlist ticker: +0.10"
    - "Factor crowding or regime shift signal: +0.05"
    - "Directly contradicts current position thesis: +0.05 (flag as risk)"
