name: Run Backtest (Sleeve 2)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - env:
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
        run: python -m sleeve2.sleeve2_backtest
