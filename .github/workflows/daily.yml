name: Daily Quant Report

on:
  workflow_dispatch: {}
  schedule:
    # 5:30am ET = 10:30 UTC (Mon–Fri) during Standard Time (EST)
    - cron: "30 10 * * 1-5"

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest
          python -m pytest --version

      - name: Validate required email secrets
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          missing=()
          for var in EMAIL_SENDER EMAIL_APP_PASSWORD EMAIL_RECIPIENT; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Run daily quant report (paper mode)
        env:
          PAPER_TRADING: "1"
          DATE_FORMAT: "US"
          DISPLAY_DECIMALS: "2"

          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}

          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python daily_quant_report.py

      - name: Ensure artifact directories exist
        if: always()
        run: |
          mkdir -p outputs/daily signals

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-outputs
          if-no-files-found: warn
          path: |
            outputs/daily/**
            signals/**
