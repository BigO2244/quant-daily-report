name: Daily Quant Report

on:
  workflow_dispatch: {}
  schedule:
    # 9:30am ET = 14:30 UTC (Mon–Fri)
    - cron: "30 14 * * 1-5"

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily quant report (paper mode)
        env:
          PAPER_TRADING: "1"
          DATE_FORMAT: "US"
          DISPLAY_DECIMALS: "2"

          # Disable SMTP in GitHub
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}

        run: |
          python daily_quant_report.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-outputs
          path: |
            outputs/daily/**
            signals/**
