name: Morning Quant Report (Sleeve 2)

on:
  schedule:
    # 12:00 UTC = 7:00 AM Eastern (Mon–Fri)
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Email secrets sanity check
        run: |
          python3 - <<'PY'
          import os
          keys = ["SMTP_HOST","SMTP_PORT","SMTP_USER","SMTP_PASSWORD","REPORT_TO_EMAIL"]
          for k in keys:
              print(k, "SET" if os.environ.get(k) else "MISSING")
          PY

      - name: Run daily quant report (Sleeve 1 + Sleeve 2)
        env:
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}

          # Map existing email secrets to SMTP vars expected by send_email()
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python3 daily_quant_report.py

