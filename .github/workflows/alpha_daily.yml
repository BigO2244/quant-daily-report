name: Alpha Daily Run

on:
  workflow_dispatch:
    inputs:
      email_dry_run:
        description: "Run SMTP TLS dry-run only (no send)."
        required: false
        type: boolean
        default: false
  schedule:
    # 6:15am ET ≈ 11:15 UTC (adjust for DST if you want)
    - cron: "15 11 * * 1-5"

jobs:
  alpha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print email script version
        run: |
          python3 -c "import scripts.email_alpha_report as m; print('EMAIL_SCRIPT_VERSION', getattr(m, '__EMAIL_SCRIPT_VERSION__', 'MISSING'))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run research backtest + report (refresh market data)
        env:
          DATE_FORMAT: "US"
        run: |
          python3 scripts/alpha_report.py --apply-costs --cost-bps 25

      - name: Update shadow NAV from alpha timeseries
        run: |
          python3 scripts/daily_alpha_run.py

      - name: Assert email env wiring
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          for key in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD REPORT_TO_EMAIL; do
            if [[ -n "${!key:-}" ]]; then
              echo "[EMAIL_ENV] ${key}=SET"
            else
              echo "[EMAIL_ENV] ${key}=MISSING"
            fi
          done

      - name: Email alpha report dry-run (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.email_dry_run }}
        continue-on-error: true
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_DRY_RUN: "1"
        run: |
          python3 scripts/email_alpha_report.py

      - name: Email alpha report
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.email_dry_run) }}
        continue-on-error: true
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python3 scripts/email_alpha_report.py

      - name: Upload alpha report artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-report
          path: outputs/alpha_report

      - name: Commit updated live NAV ledger
        run: |
          if git status --porcelain | grep -q "data/live_nav.csv"; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/live_nav.csv
            git commit -m "Update live NAV ledger"
            git push
          else
            echo "No ledger changes to commit."
          fi
