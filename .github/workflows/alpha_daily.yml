name: Alpha Daily Run

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  alpha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set run metadata
        run: |
          set -euxo pipefail
          REPORT_DATE="$(TZ=America/New_York date +%F)"
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run research backtest + report (refresh market data)
        env:
          DATE_FORMAT: "US"
        run: |
          python3 scripts/alpha_report.py --apply-costs --cost-bps 25

      - name: Update shadow NAV from alpha timeseries
        run: |
          python3 scripts/daily_alpha_run.py

      - name: Archive alpha artifacts into run folder
        run: |
          set -euxo pipefail
          mkdir -p "outputs/runs/${RUN_ID}/reports" "outputs/runs/${RUN_ID}/snapshots"
          if [ -d outputs/alpha_report ]; then
            cp -R outputs/alpha_report/. "outputs/runs/${RUN_ID}/reports/"
          fi
          if [ -f data/live_nav.csv ]; then
            cp data/live_nav.csv "outputs/runs/${RUN_ID}/snapshots/live_nav.csv"
          fi
          python3 - << 'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          run_id = os.environ.get("RUN_ID", "").strip()
          report_date = os.environ.get("REPORT_DATE", "").strip() or None
          run_root = Path("outputs") / "runs" / run_id
          payload = {
              "run_id": run_id,
              "created_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "report_date": report_date,
              "mode": "alpha_shadow",
              "paper_trading": None,
              "git_sha": os.environ.get("GITHUB_SHA"),
              "path": str(run_root),
          }
          run_root.mkdir(parents=True, exist_ok=True)
          (run_root / "meta.json").write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")
          Path("outputs").mkdir(parents=True, exist_ok=True)
          (Path("outputs") / "latest.json").write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")
          PY

      - name: Debug email script fingerprint
        if: ${{ vars.ENABLE_EMAIL != '0' }}
        run: |
          python3 - << 'PY'
          import hashlib, pathlib
          p = pathlib.Path("scripts/email_alpha_report.py")
          b = p.read_bytes()
          print("EMAIL_SHA256", hashlib.sha256(b).hexdigest())
          PY

      - name: Debug email env presence
        if: ${{ vars.ENABLE_EMAIL != '0' }}
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN }}
        run: |
          python3 - << 'PY'
          import os
          for k in ["SMTP_HOST","SMTP_PORT","SMTP_USER","SMTP_PASSWORD","REPORT_TO_EMAIL","EMAIL_DRY_RUN"]:
              v = os.getenv(k)
              print(k, "SET" if (v and str(v).strip()) else "MISSING")
          PY

      - name: Email alpha report
        if: ${{ vars.ENABLE_EMAIL != '0' }}
        continue-on-error: true
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN }}
        run: |
          python3 scripts/email_alpha_report.py

      - name: Upload alpha report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-shadow-${{ env.REPORT_DATE }}-${{ env.RUN_ID }}
          if-no-files-found: warn
          path: outputs/runs/${{ env.RUN_ID }}/

      - name: Commit updated live NAV ledger
        run: |
          if git status --porcelain | grep -q "data/live_nav.csv"; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/live_nav.csv
            git commit -m "Update live NAV ledger"
            git push
          else
            echo "No ledger changes to commit."
          fi
