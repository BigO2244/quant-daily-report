name: Run Backtest (Sleeve 2)

on:
  workflow_dispatch:
  pull_request:
    branches: [ sleeve-2 ]
  push:
    branches: [ sleeve-2 ]

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Run backtest
        env:
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
        run: |
          python3 run.py --mode backtest --sleeve sleeve-2
