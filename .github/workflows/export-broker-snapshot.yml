name: Export Alpaca Broker Snapshot

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date (YYYY-MM-DD). Leave blank for today ET."
        required: false
        type: string

jobs:
  export_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      REPORT_DATE: ${{ inputs.report_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Resolve report date
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REPORT_DATE:-}" ]; then
            REPORT_DATE="$(TZ=America/New_York date +%F)"
          fi
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "[BROKER_SNAPSHOT] report_date=$REPORT_DATE"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Export read-only broker snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export_alpaca_broker_snapshot.py --report-date "$REPORT_DATE"

      - name: Rebuild dashboard from refreshed broker artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_quant_dashboard.py --repo-root . --trade-date "$REPORT_DATE" --output-dir web/dashboard --skip-live-broker

      - name: Upload broker snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: broker-snapshot-${{ env.REPORT_DATE }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: outputs/broker_snapshot/broker_snapshot_${{ env.REPORT_DATE }}.json

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-${{ env.REPORT_DATE }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            web/dashboard/dashboard-data.json
            web/dashboard/dashboard_data.json
            web/dashboard/trading_day_summary.json
