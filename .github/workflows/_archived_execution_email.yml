name: Trade Execution Email

on:
  workflow_dispatch: {}
  schedule:
    # 8:00am ET = 13:00 UTC (Mon–Fri) during Standard Time (EST)
    # TODO(phase3): handle DST/calendar-aware scheduling for US/Eastern.
    - cron: "0 13 * * 1-5"

jobs:
  send-execution-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily quant report (build execution payload)
        env:
          PAPER_TRADING: "1"
          DATE_FORMAT: "US"
          DISPLAY_DECIMALS: "2"

          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python daily_quant_report.py

      - name: Verify trade execution email script exists
        run: |
          echo "Current working directory:"
          pwd
          echo "Directory contents:"
          ls -la
          echo "Verifying script exists..."
          test -f daily_trade_execution_email.py

      - name: Send trade execution email
        continue-on-error: true
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.EMAIL_SENDER }}
          SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: python daily_trade_execution_email.py

      - name: Upload execution email artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-email-outputs
          path: |
            outputs/daily/trade_execution_*.txt
            outputs/execution_email/*.json
