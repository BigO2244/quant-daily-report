name: Sleeve1 Robustness Backtest

on:
  workflow_dispatch: {}

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Sleeve1 robustness backtest
        run: |
          python -m backtests.sleeve1_robustness --start 2005-01-01 --top_n 10
      - name: Upload robustness artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sleeve1-robustness
          path: outputs/backtests/sleeve1_robustness/**
          if-no-files-found: error
