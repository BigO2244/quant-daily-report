name: Sleeve1 Robustness Backtest

on:
  workflow_dispatch: {}

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Sleeve1 robustness backtest
        run: |
          python -m backtests.sleeve1_robustness --start 2005-01-01 --top_n 10
      - name: Upload robustness artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sleeve1-robustness
          path: outputs/backtests/sleeve1_robustness/**
          if-no-files-found: error
