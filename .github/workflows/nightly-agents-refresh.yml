name: Nightly Agents Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Refresh AGENTS.md
        run: |
          python3 scripts/update_agents_md.py \
            --agents AGENTS.md \
            --audit repo_workflow_audit.md \
            --report-dir reports/agents \
            --report-dir reports/ai_runs \
            --report-dir reports/incidents

      - name: Commit refreshed AGENTS.md
        run: |
          if git diff --quiet -- AGENTS.md; then
            echo "AGENTS.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "docs: refresh AGENTS nightly findings"
          git push
