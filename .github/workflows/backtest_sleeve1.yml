name: Run Backtest (Sleeve 1)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt
      - env:
          ACCOUNT_EQUITY: ${{ secrets.ACCOUNT_EQUITY }}
        run: python -m backtests.sleeve1_robustness --start 2005-01-01 --top_n 10
