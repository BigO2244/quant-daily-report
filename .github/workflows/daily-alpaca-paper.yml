name: Daily Alpaca Paper Run (Deprecated Wrapper)

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Override REPORT_DATE (YYYY-MM-DD)."
        required: false
        type: string

jobs:
  deprecated_wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Stop deprecated wrapper usage
        shell: bash
        run: |
          echo "::error::daily-alpaca-paper.yml is deprecated."
          echo "::error::Use Daily Alpaca Precompute for 7:30 ET planning and Daily Alpaca Live for 9:35 ET execution."
          exit 1
