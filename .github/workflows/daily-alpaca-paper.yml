name: Daily Alpaca Paper Run

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Override REPORT_DATE (YYYY-MM-DD). Leave blank for today ET."
        required: false
        type: string
      workflow_stage:
        description: "auto | precompute | live"
        required: false
        type: string
        default: auto
      continuation_mode:
        description: "none | buy_only"
        required: false
        type: string
        default: none
  schedule:
    # Precompute target: 7:30 AM America/New_York.
    # EST weekdays use 12:30 UTC, EDT weekdays use 11:30 UTC.
    - cron: "30 12 * 1,2,12 1-5"
    - cron: "30 12 1-7 3 1-5"
    - cron: "30 11 8-31 3 1-5"
    - cron: "30 11 * 4-10 1-5"
    - cron: "30 11 1-7 11 1-5"
    - cron: "30 12 8-30 11 1-5"
    # Live execution target: 9:35 AM America/New_York.
    # EST weekdays use 14:35 UTC, EDT weekdays use 13:35 UTC.
    - cron: "35 14 * 1,2,12 1-5"
    - cron: "35 14 1-7 3 1-5"
    - cron: "35 13 8-31 3 1-5"
    - cron: "35 13 * 4-10 1-5"
    - cron: "35 13 1-7 11 1-5"
    - cron: "35 14 8-30 11 1-5"

jobs:
  classify_stage:
    runs-on: ubuntu-latest
    outputs:
      workflow_stage: ${{ steps.meta.outputs.workflow_stage }}
      report_date: ${{ steps.meta.outputs.report_date }}
      workflow_started_at_utc: ${{ steps.meta.outputs.workflow_started_at_utc }}
    steps:
      - name: Resolve workflow stage and trade date
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.report_date }}" ]; then
            REPORT_DATE="${{ inputs.report_date }}"
          else
            REPORT_DATE="$(TZ=America/New_York date +%F)"
          fi
          WORKFLOW_STARTED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANUAL_STAGE="${{ inputs.workflow_stage }}"
          SCHEDULE="${{ github.event.schedule }}"

          PRECOMPUTE_CRONS=(
            "30 12 * 1,2,12 1-5"
            "30 12 1-7 3 1-5"
            "30 11 8-31 3 1-5"
            "30 11 * 4-10 1-5"
            "30 11 1-7 11 1-5"
            "30 12 8-30 11 1-5"
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_STAGE" ] && [ "$MANUAL_STAGE" != "auto" ]; then
            STAGE="$MANUAL_STAGE"
          else
            STAGE="live"
            for cron in "${PRECOMPUTE_CRONS[@]}"; do
              if [ "$SCHEDULE" = "$cron" ]; then
                STAGE="precompute"
                break
              fi
            done
          fi

          echo "workflow_stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "workflow_started_at_utc=$WORKFLOW_STARTED_AT_UTC" >> "$GITHUB_OUTPUT"
          echo "[META] workflow_stage=$STAGE report_date=$REPORT_DATE workflow_started_at_utc=$WORKFLOW_STARTED_AT_UTC"

  precompute:
    needs: classify_stage
    if: ${{ needs.classify_stage.outputs.workflow_stage == 'precompute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      RECON_V2: 1
      PLAN_ONLY: "1"
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
      TZ: America/New_York
      EMAIL_INLINE_REPORTS: "0"
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "0"
      EMAIL_TRADING_CONFIRMATION: "0"
      EMAIL_INTERNAL_DEBUG: "0"
      WORKFLOW_STARTED_AT_UTC: ${{ needs.classify_stage.outputs.workflow_started_at_utc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: outputs/paper_state/canonical_positions.json
          key: canonical-model-snapshot-v2-${{ env.REPORT_DATE }}
          restore-keys: |
            canonical-model-snapshot-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run precompute planner
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 daily_quant_report.py --plan-only --write-precompute-bundle

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: outputs/paper_state/canonical_positions.json
          key: canonical-model-snapshot-v2-${{ env.REPORT_DATE }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: outputs/precompute/${{ env.REPORT_DATE }}
          key: alpaca-precompute-v1-${{ env.REPORT_DATE }}

      - name: Upload precompute artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-precompute
          if-no-files-found: warn
          path: |
            outputs/precompute/${{ env.REPORT_DATE }}/**
            outputs/latest_run.json
            outputs/runs/**

  live_primary:
    needs: classify_stage
    if: ${{ needs.classify_stage.outputs.workflow_stage == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_id: ${{ steps.meta.outputs.run_id }}
      retry_eligible: ${{ steps.decision.outputs.retry_eligible }}
      retry_reason: ${{ steps.decision.outputs.retry_reason }}
      continuation_eligible: ${{ steps.decision.outputs.continuation_eligible }}
      continuation_reason: ${{ steps.decision.outputs.continuation_reason }}
    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      RECON_V2: 1
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
      TZ: America/New_York
      EMAIL_INLINE_REPORTS: "0"
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "0"
      EMAIL_TRADING_CONFIRMATION: "0"
      EMAIL_INTERNAL_DEBUG: "0"
      WORKFLOW_STARTED_AT_UTC: ${{ needs.classify_stage.outputs.workflow_started_at_utc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set run metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_live"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: outputs/paper_state/canonical_positions.json
          key: canonical-model-snapshot-v2-${{ env.REPORT_DATE }}
          restore-keys: |
            canonical-model-snapshot-v2-

      - uses: actions/cache/restore@v4
        with:
          path: outputs/precompute/${{ env.REPORT_DATE }}
          key: alpaca-precompute-v1-${{ env.REPORT_DATE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute from precompute bundle
        id: live_run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 scripts/run_precomputed_alpaca_execution.py --retry-attempt 0

      - name: Capture retry and continuation decision
        id: decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          run_id = "${{ steps.meta.outputs.run_id }}"
          path = Path("outputs/runs") / run_id / "operator_summary.json"
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"retry_eligible={str(bool(data.get('retry_eligible'))).lower()}\n")
              fh.write(f"retry_reason={str(data.get('retry_reason') or '')}\n")
              fh.write(f"continuation_eligible={str(bool(data.get('continuation_eligible'))).lower()}\n")
              fh.write(f"continuation_reason={str(data.get('continuation_reason') or '')}\n")
          PY

      - name: Upload live primary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-live-primary
          if-no-files-found: warn
          path: |
            outputs/latest_run.json
            outputs/execution_email/${{ env.REPORT_DATE }}.json
            outputs/runs/${{ steps.meta.outputs.run_id }}/**
            outputs/execution_audit/**
            outputs/trading_day_summary.json

      - name: Fail job when live execution failed
        if: steps.live_run.outcome != 'success'
        shell: bash
        run: exit 1

  retry_precompute:
    needs: [classify_stage, live_primary]
    if: ${{ always() && needs.classify_stage.outputs.workflow_stage == 'live' && needs.live_primary.outputs.retry_eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      RECON_V2: 1
      PLAN_ONLY: "1"
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
      TZ: America/New_York
      EMAIL_INLINE_REPORTS: "0"
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "0"
      EMAIL_TRADING_CONFIRMATION: "0"
      EMAIL_INTERNAL_DEBUG: "0"
      WORKFLOW_STARTED_AT_UTC: ${{ needs.classify_stage.outputs.workflow_started_at_utc }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: outputs/paper_state/canonical_positions.json
          key: canonical-model-snapshot-v2-${{ env.REPORT_DATE }}
          restore-keys: |
            canonical-model-snapshot-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild precompute bundle for retry
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 daily_quant_report.py --plan-only --write-precompute-bundle

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: outputs/precompute/${{ env.REPORT_DATE }}
          key: alpaca-precompute-v1-${{ env.REPORT_DATE }}

      - name: Upload retry precompute artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-retry-precompute
          if-no-files-found: warn
          path: |
            outputs/precompute/${{ env.REPORT_DATE }}/**
            outputs/latest_run.json
            outputs/runs/**

  live_retry:
    needs: [classify_stage, live_primary, retry_precompute]
    if: ${{ always() && needs.classify_stage.outputs.workflow_stage == 'live' && needs.live_primary.outputs.retry_eligible == 'true' && needs.retry_precompute.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      run_id: ${{ steps.meta.outputs.run_id }}
      continuation_eligible: ${{ steps.decision.outputs.continuation_eligible }}
      continuation_reason: ${{ steps.decision.outputs.continuation_reason }}
    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      RECON_V2: 1
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
      TZ: America/New_York
      EMAIL_INLINE_REPORTS: "0"
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "0"
      EMAIL_TRADING_CONFIRMATION: "0"
      EMAIL_INTERNAL_DEBUG: "0"
      WORKFLOW_STARTED_AT_UTC: ${{ needs.classify_stage.outputs.workflow_started_at_utc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set retry run metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_retry"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: outputs/precompute/${{ env.REPORT_DATE }}
          key: alpaca-precompute-v1-${{ env.REPORT_DATE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute retry from refreshed precompute bundle
        id: retry_run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 scripts/run_precomputed_alpaca_execution.py --retry-attempt 1

      - name: Capture continuation decision
        id: decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          run_id = "${{ steps.meta.outputs.run_id }}"
          path = Path("outputs/runs") / run_id / "operator_summary.json"
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"continuation_eligible={str(bool(data.get('continuation_eligible'))).lower()}\n")
              fh.write(f"continuation_reason={str(data.get('continuation_reason') or '')}\n")
          PY

      - name: Upload live retry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-live-retry
          if-no-files-found: warn
          path: |
            outputs/latest_run.json
            outputs/execution_email/${{ env.REPORT_DATE }}.json
            outputs/runs/${{ steps.meta.outputs.run_id }}/**
            outputs/execution_audit/**
            outputs/trading_day_summary.json

      - name: Fail job when retry execution failed
        if: steps.retry_run.outcome != 'success'
        shell: bash
        run: exit 1

  continue_buys:
    needs: [classify_stage, live_primary, live_retry]
    if: ${{ always() && needs.classify_stage.outputs.workflow_stage == 'live' && (needs.live_retry.outputs.continuation_eligible == 'true' || needs.live_primary.outputs.continuation_eligible == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      RECON_V2: 1
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
      TZ: America/New_York
      EMAIL_INLINE_REPORTS: "0"
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "0"
      EMAIL_TRADING_CONFIRMATION: "0"
      EMAIL_INTERNAL_DEBUG: "0"
      WORKFLOW_STARTED_AT_UTC: ${{ needs.classify_stage.outputs.workflow_started_at_utc }}
    steps:
      - uses: actions/checkout@v4

      - name: Select continuation run id
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.live_retry.outputs.continuation_eligible }}" = "true" ]; then
            RUN_ID="${{ needs.live_retry.outputs.run_id }}"
          else
            RUN_ID="${{ needs.live_primary.outputs.run_id }}"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: outputs/precompute/${{ env.REPORT_DATE }}
          key: alpaca-precompute-v1-${{ env.REPORT_DATE }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Continue outstanding buys
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python3 scripts/run_precomputed_alpaca_execution.py --retry-attempt 1 --continuation-mode buy_only

      - name: Upload continuation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-live-continuation
          if-no-files-found: warn
          path: |
            outputs/latest_run.json
            outputs/execution_email/${{ env.REPORT_DATE }}.json
            outputs/runs/${{ steps.meta.outputs.run_id }}/**
            outputs/execution_audit/**
            outputs/trading_day_summary.json

  email:
    needs: [classify_stage, live_primary, retry_precompute, live_retry, continue_buys]
    if: ${{ always() && needs.classify_stage.outputs.workflow_stage == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.EMAIL_SENDER }}
      SMTP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      REPORT_TO_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN || '0' }}
      EMAIL_MARKET_CONDITIONS: "0"
      EMAIL_PRETRADE: "1"
      EMAIL_TRADING_CONFIRMATION: "1"
      EMAIL_INTERNAL_DEBUG: "0"
      REPORT_DATE: ${{ needs.classify_stage.outputs.report_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download live primary artifacts
        uses: actions/download-artifact@v4
        with:
          name: alpaca-live-primary
          path: downloaded_primary
        continue-on-error: true

      - name: Download live retry artifacts
        uses: actions/download-artifact@v4
        with:
          name: alpaca-live-retry
          path: downloaded_retry
        continue-on-error: true

      - name: Download live continuation artifacts
        uses: actions/download-artifact@v4
        with:
          name: alpaca-live-continuation
          path: downloaded_continuation
        continue-on-error: true

      - name: Prepare persisted email inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/execution_email outputs/runs

          latest_src="$(find downloaded_primary downloaded_retry downloaded_continuation -type f -name 'latest_run.json' 2>/dev/null | tail -n1 || true)"
          if [ -n "$latest_src" ]; then
            mkdir -p outputs
            cp -f "$latest_src" outputs/latest_run.json
          fi

          payload_src="$(find downloaded_primary downloaded_retry downloaded_continuation -type f -path "*/execution_email/${REPORT_DATE}.json" 2>/dev/null | tail -n1 || true)"
          if [ -n "$payload_src" ]; then
            cp -f "$payload_src" "outputs/execution_email/${REPORT_DATE}.json"
          fi

          while IFS= read -r run_root_src; do
            run_id="$(basename "$run_root_src")"
            mkdir -p "outputs/runs/$run_id"
            cp -R "$run_root_src"/. "outputs/runs/$run_id"/ || true
          done < <(find downloaded_primary downloaded_retry downloaded_continuation -type d -path '*/runs/*' 2>/dev/null | grep -E '/runs/[^/]+$' || true)

      - name: Guard email credentials (auto dry-run when missing)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SMTP_USER SMTP_PASSWORD REPORT_TO_EMAIL; do
            if [ -z "${!key:-}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "EMAIL_DRY_RUN=1" >> "$GITHUB_ENV"
            echo "SMTP_USER=dryrun-sender@example.invalid" >> "$GITHUB_ENV"
            echo "SMTP_PASSWORD=dryrun-password" >> "$GITHUB_ENV"
            echo "EMAIL_SENDER=dryrun-sender@example.invalid" >> "$GITHUB_ENV"
            echo "EMAIL_APP_PASSWORD=dryrun-password" >> "$GITHUB_ENV"
            echo "REPORT_TO_EMAIL=dryrun-recipient@example.invalid" >> "$GITHUB_ENV"
            echo "EMAIL_RECIPIENT=dryrun-recipient@example.invalid" >> "$GITHUB_ENV"
          fi

      - name: Send pre-trade execution status email
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          cmd=(.venv/bin/python daily_trade_execution_email.py)
          if [ "${EMAIL_DRY_RUN:-0}" = "1" ] || [ "${EMAIL_DRY_RUN:-}" = "true" ]; then
            cmd+=(--dry-run)
          fi
          "${cmd[@]}"

      - name: Send trading confirmation email from execution results
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          if [ ! -f outputs/latest_run.json ]; then
            exit 0
          fi
          run_root="$(.venv/bin/python -c "import json, pathlib; p=pathlib.Path('outputs/latest_run.json'); print((json.loads(p.read_text(encoding='utf-8')).get('run_root','') if p.exists() else ''))")"
          if [ -z "$run_root" ] || [ ! -f "$run_root/execution_results.json" ]; then
            exit 0
          fi
          .venv/bin/python scripts/send_trading_confirmation_email.py
