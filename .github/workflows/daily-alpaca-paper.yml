name: Daily Alpaca Paper Run

# Auto-Bootstrap Feature:
# When PRETRADE reconciliation fails (broker/model position drift), the workflow can
# automatically refresh the canonical model snapshot from broker positions.
# - Controlled by repo variable: AUTO_BOOTSTRAP_ON_RECON_FAIL (default: 0 = disabled)
# - When enabled: auto-bootstraps, sends email with drift details, next run succeeds
# - When disabled: workflow fails with exit 2, requires manual bootstrap via workflow_dispatch
# - Safety: Never places orders when drift detected
# - See docs/OPERATIONS.md for full details

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Override REPORT_DATE (YYYY-MM-DD). Leave blank for today ET."
        required: false
        type: string
      bootstrap_model_ledger_from_broker:
        description: "Run bootstrap-only mode (writes canonical model snapshot from broker, exits without orders)."
        required: false
        type: boolean
        default: false
  schedule:
    # 9:35 AM America/New_York is 14:35 UTC in EST and 13:35 UTC in EDT.
    # Keep both cron entries to handle DST shifts.
    - cron: "35 14 * * 1-5"
    - cron: "35 13 * * 1-5"

jobs:
  engine_run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report_date: ${{ steps.set_meta.outputs.report_date }}

    env:
      TRADING_MODE: alpaca
      MODE: alpaca
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"

      # Secrets (do not print these)
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

      # If user passed an override date via workflow_dispatch
      REPORT_DATE: ${{ inputs.report_date }}

      # Bootstrap only allowed via workflow_dispatch; never via schedule
      BOOTSTRAP_MODEL_LEDGER_FROM_BROKER: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_model_ledger_from_broker || 'false' }}

      # Ensure date calculations use Eastern if REPORT_DATE isn't provided
      TZ: America/New_York
      EMAIL_STRICT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print commit info
        shell: bash
        run: |
          set -euo pipefail
          echo "[GIT] Current commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Restore canonical model snapshot (cache)
        uses: actions/cache@v4
        with:
          path: outputs/paper_state/canonical_positions.json
          # Stable key: overwrites the single cache entry each run so there is always exactly
          # one canonical snapshot and restore-keys never need to guess.  A per-run key
          # (e.g. appending github.run_id) creates unbounded entries that GitHub evicts after
          # 7 days, which would cause reconciliation to fail after any 5-day gap.
          key: canonical-model-snapshot-v1
          restore-keys: |
            canonical-model-snapshot-v1

      - name: Debug trigger + inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "event_name=${{ github.event_name }}"
          echo "report_date_input='${{ inputs.report_date }}'"
          echo "bootstrap_input='${{ inputs.bootstrap_model_ledger_from_broker }}'"
          echo "BOOTSTRAP_MODEL_LEDGER_FROM_BROKER='${BOOTSTRAP_MODEL_LEDGER_FROM_BROKER}'"
          echo "REPORT_DATE='${REPORT_DATE}'"
          echo "TZ='${TZ}'"

      - name: Set run metadata
        id: set_meta
        shell: bash
        run: |
          set -euxo pipefail
          if [ -z "${REPORT_DATE:-}" ]; then
            REPORT_DATE="$(TZ=America/New_York date +%F)"
          fi
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "REPORT_DATE=$REPORT_DATE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Assert meta outputs present
        shell: bash
        run: |
          set -euo pipefail
          echo "[META] report_date='${{ steps.set_meta.outputs.report_date }}' run_id='${RUN_ID}'"
          if [ -z "${{ steps.set_meta.outputs.report_date }}" ]; then
            echo "[META][ERROR] report_date is empty"
            exit 1
          fi
          if [ -z "${RUN_ID:-}" ]; then
            echo "[META][ERROR] RUN_ID env is empty"
            exit 1
          fi
          echo "[META][OK] All metadata outputs validated"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alpaca smoke test (non-fatal)
        shell: bash
        run: |
          source .venv/bin/activate
          python3 alpaca_smoke_test.py || true

      - name: Alpaca raw /v2/account probe
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import os
          import ssl
          import urllib.request

          base = (os.environ.get("ALPACA_BASE_URL") or "").rstrip("/")
          key = os.environ.get("ALPACA_API_KEY_ID")
          sec = os.environ.get("ALPACA_API_SECRET_KEY")

          if base.endswith("/v2"):
              base = base[:-3]
          print("BASE", base)
          print("key_set", bool(key), "secret_set", bool(sec))
          url = base + "/v2/account"

          req = urllib.request.Request(
              url,
              headers={
                  "APCA-API-KEY-ID": key or "",
                  "APCA-API-SECRET-KEY": sec or "",
              },
          )
          ctx = ssl.create_default_context()
          with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
              body = resp.read().decode("utf-8", errors="replace")
              print("GET", url, "->", resp.status, body[:200])
          PY

      - name: Verify Alpaca env presence (no values)
        shell: bash
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
        run: |
          python3 - <<'PY'
          import os
          for k in ["ALPACA_API_KEY_ID","ALPACA_API_SECRET_KEY","ALPACA_PAPER"]:
              v = os.environ.get(k, "")
              leading_ws = bool(v) and v[:1].isspace()
              trailing_ws = bool(v) and v[-1:].isspace()
              has_newline = ("\n" in v) or ("\r" in v)
              print(f"{k}: set={'YES' if v else 'NO'} len={len(v)} leading_ws={leading_ws} trailing_ws={trailing_ws} has_newline={has_newline}")
          PY

      - name: Diag Alpaca auth (safe)
        shell: bash
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
        run: |
          set -euo pipefail
          mkdir -p outputs
          .venv/bin/python scripts/diag_alpaca_auth.py | tee outputs/diag_alpaca_auth.log
          grep -q "\[DIAG\]\[CURL\] HTTP code: 200" outputs/diag_alpaca_auth.log
          grep -q "\[DIAG\]\[PY\] OK" outputs/diag_alpaca_auth.log

      - name: Check critical env vars (SET/MISSING only, no values)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          critical_vars = [
              "ALPACA_API_KEY_ID",
              "ALPACA_API_SECRET_KEY",
              "ALPACA_PAPER",
              "ALPACA_BASE_URL",
              "MODE",
              "TRADING_MODE",
              "REPORT_DATE",
              "TZ",
          ]
          print("[ENV_CHECK] Critical variable status (DO NOT PRINT VALUES):")
          all_set = True
          for var in critical_vars:
              status = "SET" if os.environ.get(var) else "MISSING"
              print(f"  {var}={status}")
              if status == "MISSING":
                  all_set = False
          if not all_set:
              print("\n[ENV_CHECK][ERROR] Some critical env vars are missing!")
              raise SystemExit(1)
          print("\n[ENV_CHECK][OK] All critical env vars are set")
          PY

      - name: Verify canonical model snapshot exists (unless bootstrap)
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="${BOOTSTRAP_MODEL_LEDGER_FROM_BROKER:-false}"
          if [ "$bootstrap" = "true" ]; then
            echo "[RECON] Bootstrap mode enabled; skipping canonical snapshot precheck"
            exit 0
          fi
          if [ ! -f outputs/paper_state/canonical_positions.json ]; then
            echo "[RECON][ERROR] Missing outputs/paper_state/canonical_positions.json"
            echo "[RECON][ACTION] Run workflow_dispatch once with bootstrap_model_ledger_from_broker=true"
            exit 1
          fi

      - name: Run daily quant execution
        shell: bash
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          mkdir -p outputs
          status=0
          cmd=(python3 daily_quant_report.py)
          if [ "${BOOTSTRAP_MODEL_LEDGER_FROM_BROKER:-false}" = "true" ]; then
            cmd+=(--bootstrap-model-ledger-from-broker)
          fi
          if ! "${cmd[@]}" 2>&1 | tee outputs/ci_alpaca_run.log; then
            status=$?
          fi
          mkdir -p "outputs/runs/${RUN_ID}/logs"
          cp -f outputs/ci_alpaca_run.log "outputs/runs/${RUN_ID}/logs/ci_alpaca_run.log" || true
          echo "$status" > outputs/exit_status.txt
          exit "$status"

      - name: Auto-bootstrap on reconciliation failure (if enabled)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          
          # Read the exit status from previous step
          if [ ! -f outputs/exit_status.txt ]; then
            echo "[AUTO_BOOTSTRAP] No exit status file found; skipping auto-bootstrap check"
            exit 0
          fi
          
          exit_status=$(cat outputs/exit_status.txt)
          echo "[AUTO_BOOTSTRAP] Previous step exit status: $exit_status"
          
          # Exit code 2 means PRETRADE reconciliation failed
          if [ "$exit_status" != "2" ]; then
            echo "[AUTO_BOOTSTRAP] Exit status is not 2 (recon FAIL); skipping auto-bootstrap"
            exit 0
          fi
          
          echo "[AUTO_BOOTSTRAP] PRETRADE reconciliation failure detected (exit code 2)"

          # Safety sentinel: exit code 2 is a general POSIX error code, not exclusively
          # produced by pre-trade reconciliation.  Before triggering any broker API call
          # or snapshot write, confirm the reconciliation report file was actually written
          # by the reconciliation module.  If it is absent, a different code path produced
          # the exit 2 (e.g. argparse misuse, library error) and bootstrapping would
          # silently overwrite a correct canonical snapshot with stale or empty broker data.
          recon_sentinel="outputs/broker/recon_pretrade_${REPORT_DATE:-unknown}.json"
          if [ ! -f "$recon_sentinel" ]; then
            echo "[AUTO_BOOTSTRAP][SAFETY] Sentinel not found: $recon_sentinel"
            echo "[AUTO_BOOTSTRAP][SAFETY] exit code 2 did NOT originate from pre-trade reconciliation"
            echo "[AUTO_BOOTSTRAP][SAFETY] Refusing to bootstrap — manual investigation required"
            echo "[AUTO_BOOTSTRAP][SAFETY] Check outputs/ci_alpaca_run.log for the actual failure cause"
            exit 2
          fi
          echo "[AUTO_BOOTSTRAP] Sentinel confirmed: $recon_sentinel"

          # Check if auto-bootstrap is enabled via repo variable (default: disabled)
          auto_bootstrap="${{ vars.AUTO_BOOTSTRAP_ON_RECON_FAIL || '0' }}"
          echo "[AUTO_BOOTSTRAP] AUTO_BOOTSTRAP_ON_RECON_FAIL setting: $auto_bootstrap"
          
          if [ "$auto_bootstrap" != "1" ] && [ "$auto_bootstrap" != "true" ]; then
            echo "[AUTO_BOOTSTRAP] Auto-bootstrap is DISABLED; workflow will fail with exit 2"
            echo "[AUTO_BOOTSTRAP] To enable: Set repository variable AUTO_BOOTSTRAP_ON_RECON_FAIL=1"
            echo "[AUTO_BOOTSTRAP] Or manually run with workflow_dispatch input: bootstrap_model_ledger_from_broker=true"
            exit 2
          fi
          
          echo "[AUTO_BOOTSTRAP] Auto-bootstrap is ENABLED; attempting to bootstrap canonical snapshot from broker..."
          
          # Activate venv and run bootstrap
          source .venv/bin/activate
          
          if python3 daily_quant_report.py --bootstrap-model-ledger-from-broker 2>&1 | tee -a outputs/ci_alpaca_run.log; then
            echo "[AUTO_BOOTSTRAP][SUCCESS] Canonical snapshot refreshed from broker positions"
            echo "[AUTO_BOOTSTRAP] Next scheduled run should pass PRETRADE reconciliation"
            
            # Update run log with bootstrap success
            mkdir -p "outputs/runs/${RUN_ID}/logs"
            cp -f outputs/ci_alpaca_run.log "outputs/runs/${RUN_ID}/logs/ci_alpaca_run.log" || true
            
            # Create a marker file to indicate auto-bootstrap was triggered
            echo "{\"auto_bootstrap_triggered\": true, \"reason\": \"pretrade_recon_fail\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > "outputs/runs/${RUN_ID}/auto_bootstrap.json"
            
            # Create execution email payload with recon failure info
            echo "[AUTO_BOOTSTRAP] Creating execution email payload with recon failure info..."
            mkdir -p "outputs/execution_email"
            
            # Try to read recon report for details
            recon_report_path="outputs/broker/recon_pretrade_${REPORT_DATE}.json"
            export recon_data="{}"
            if [ -f "$recon_report_path" ]; then
              echo "[AUTO_BOOTSTRAP] Found recon report: $recon_report_path"
              recon_data=$(cat "$recon_report_path" | python3 -c "import json, sys; data = json.load(sys.stdin); print(json.dumps({'verdict': data.get('verdict'), 'diffs': data.get('diffs')}))" 2>/dev/null || echo "{}")
              export recon_data
            else
              echo "[AUTO_BOOTSTRAP] Recon report not found at $recon_report_path"
            fi
            
            # Create execution email payload with recon failure info
            mkdir -p "outputs/execution_email"
            python3 -c '
import json, os
from pathlib import Path

report_date = os.environ["REPORT_DATE"]
run_id = os.environ["RUN_ID"]
recon_data_str = os.environ.get("recon_data", "{}")

try:
    recon_data = json.loads(recon_data_str)
except:
    recon_data = {}

payload = {
    "trade_date": report_date,
    "mode": "ALPACA",
    "execution_status": "HALTED",
    "halt_reason": "PRETRADE RECONCILIATION FAILED — AUTO BOOTSTRAP TRIGGERED",
    "status_label": "RECON_FAIL_AUTO_BOOTSTRAP",
    "status_reason": "Broker/model positions diverged; canonical snapshot auto-refreshed from broker. Next run should succeed.",
    "trades": [],
    "run_id": run_id,
    "order_ids": [],
    "auto_bootstrap_triggered": True,
    "recon_failure": True,
    "recon_verdict": recon_data.get("verdict", "FAIL"),
    "recon_diffs": recon_data.get("diffs", {}),
    "market_status": "CLOSED",
    "execution_notes": [
        "⚠️ NO TRADES SENT — PRETRADE RECONCILIATION FAILED",
        "Auto-bootstrap refreshed canonical model snapshot from broker positions.",
        "Next scheduled run should pass reconciliation and resume normal trading.",
        "Review recon diffs below for details on position mismatches."
    ]
}

out_path = Path("outputs/execution_email") / f"{report_date}.json"
out_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
print(f"[AUTO_BOOTSTRAP] Execution email payload written: {out_path}")
'
            
            # Exit 0 to mark this run as "recovered" (not a hard failure)
            exit 0
          else
            bootstrap_status=$?
            echo "[AUTO_BOOTSTRAP][ERROR] Bootstrap failed with exit code: $bootstrap_status"
            echo "[AUTO_BOOTSTRAP] Manual intervention required"
            exit 1
          fi

      - name: Save updated canonical snapshot to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/paper_state/canonical_positions.json
          # Must match the restore key so this overwrites the previous entry in-place.
          key: canonical-model-snapshot-v1
        continue-on-error: true

      - name: List files before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "[UPLOAD_PREP] Listing files to be uploaded:"
          echo "Run directory: outputs/runs/${RUN_ID}/"
          ls -laR "outputs/runs/${RUN_ID}/" || echo "[WARN] Run directory not found"
          echo "Execution email payload: outputs/execution_email/${REPORT_DATE}.json"
          ls -la "outputs/execution_email/${REPORT_DATE}.json" || echo "[WARN] Execution email payload not found"
          echo "Canonical positions: outputs/paper_state/canonical_positions.json"
          ls -la "outputs/paper_state/canonical_positions.json" || echo "[WARN] Canonical positions not found"

      - name: Upload canonical model snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-model-snapshot
          if-no-files-found: warn
          path: |
            outputs/paper_state/canonical_positions.json

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-paper
          if-no-files-found: warn
          path: |
            outputs/runs/${{ steps.set_meta.outputs.run_id }}/
            outputs/paper_state/canonical_positions.json
            outputs/execution_email/${{ env.REPORT_DATE }}.json

  email:
    needs: engine_run
    if: always()   # must run even when engine_run fails (recon failure, auto-bootstrap) so operator is always notified
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      REPORT_DATE: ${{ needs.engine_run.outputs.report_date }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
      EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print commit info
        shell: bash
        run: |
          set -euo pipefail
          echo "[GIT] Current commit:"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Assert email job env vars present
        shell: bash
        run: |
          set -euo pipefail
          echo "[EMAIL_META] report_date='${REPORT_DATE}'"
          if [ -z "${REPORT_DATE}" ]; then
            echo "[EMAIL_META][ERROR] REPORT_DATE is empty"
            exit 1
          fi
          echo "[EMAIL_META][OK] Artifact name will be: alpaca-paper"

      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: alpaca-paper
          path: downloaded

      - name: Infer RUN_ID from downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$(find downloaded -type d -path '*/runs/*' | grep -E '/runs/[^/]+$' | head -n 1 || true)"
          if [ -z "$RUN_DIR" ]; then
            echo "[EMAIL][ERROR] Could not find downloaded/**/runs/<RUN_ID>/"
            find downloaded -maxdepth 6 -type f -print || true
            exit 1
          fi
          RUN_ID="$(basename "$RUN_DIR")"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "[EMAIL_META] inferred RUN_ID=$RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare persisted email inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/execution_email outputs/daily
          payload_src="$(find downloaded -type f -path "*/execution_email/${REPORT_DATE}.json" | head -n1 || true)"
          if [ -n "$payload_src" ]; then
            cp -f "$payload_src" "outputs/execution_email/${REPORT_DATE}.json"
          else
            echo "[EMAIL][WARN] execution payload not found for ${REPORT_DATE}"
          fi

      - name: Guard email credentials (auto dry-run when missing)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in SMTP_USER SMTP_PASSWORD REPORT_TO_EMAIL; do
            if [ -z "${!key:-}" ]; then
              echo "[EMAIL][WARN] ${key} is empty"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "[EMAIL][WARN] Missing SMTP credentials/recipient; forcing EMAIL_DRY_RUN=1"
            echo "EMAIL_DRY_RUN=1" >> "$GITHUB_ENV"
            if [ -z "${SMTP_USER:-}" ]; then
              echo "SMTP_USER=dryrun-sender@example.invalid" >> "$GITHUB_ENV"
              echo "EMAIL_SENDER=dryrun-sender@example.invalid" >> "$GITHUB_ENV"
            fi
            if [ -z "${SMTP_PASSWORD:-}" ]; then
              echo "SMTP_PASSWORD=dryrun-password" >> "$GITHUB_ENV"
              echo "EMAIL_APP_PASSWORD=dryrun-password" >> "$GITHUB_ENV"
            fi
            if [ -z "${REPORT_TO_EMAIL:-}" ]; then
              echo "REPORT_TO_EMAIL=dryrun-recipient@example.invalid" >> "$GITHUB_ENV"
              echo "EMAIL_RECIPIENT=dryrun-recipient@example.invalid" >> "$GITHUB_ENV"
            fi
          fi

      - name: Send execution email from persisted payload
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          cmd=(.venv/bin/python daily_trade_execution_email.py)
          if [ "${EMAIL_DRY_RUN:-0}" = "1" ] || [ "${EMAIL_DRY_RUN:-}" = "true" ]; then
            cmd+=(--dry-run)
          fi
          "${cmd[@]}"

      - name: Send snapshot email from persisted artifacts
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from core.quant_report import send_email

          report_date = os.environ.get("REPORT_DATE", "").strip()
          if not report_date:
              raise RuntimeError("REPORT_DATE is required")

          if os.environ.get("EMAIL_DRY_RUN", "").strip().lower() in {"1", "true", "yes", "y", "on"}:
              print("[EMAIL][DRY_RUN] skipping snapshot email send")
              raise SystemExit(0)

          root = Path("downloaded")
          snapshot_candidates = list(root.glob(f"**/reports/trade_snapshot_{report_date}.txt"))
          html_candidates = list(root.glob(f"**/reports/quant_report_{report_date}.html"))

          if not snapshot_candidates:
              raise RuntimeError(f"Missing persisted snapshot text for {report_date}")
          if not html_candidates:
              raise RuntimeError(f"Missing persisted HTML report for {report_date}")

          body_text = snapshot_candidates[0].read_text(encoding="utf-8")
          body_html = html_candidates[0].read_text(encoding="utf-8")
          subject = f"Daily Quant Snapshot {report_date}"
          send_email(subject=subject, body_html=body_html, body_text=body_text)
          print("[EMAIL] snapshot email sent")
          PY