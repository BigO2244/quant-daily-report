name: Research Digest — Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Refresh dashboard payload
        run: python3 scripts/refresh_quant_dashboard.py --repo-root . --output-dir web/dashboard

      - name: Build nightly findings
        run: |
          python3 scripts/build_nightly_findings.py \
            --repo-root . \
            --dashboard-data web/dashboard/dashboard-data.json \
            --audit repo_workflow_audit.md \
            --output-json reports/agents/nightly_findings.json \
            --output-md reports/agents/nightly_findings.md

      - name: Refresh AGENTS.md
        run: |
          python3 scripts/update_agents_md.py \
            --agents AGENTS.md \
            --audit repo_workflow_audit.md \
            --report-dir reports/agents \
            --report-dir reports/ai_runs \
            --report-dir reports/incidents

      - name: Commit nightly digest artifacts
        run: |
          if git diff --quiet -- AGENTS.md reports/agents web/dashboard; then
            echo "No nightly digest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md reports/agents web/dashboard
          git commit -m "docs: refresh nightly research digest"
          git push
