name: Research Digest — Nightly

# Isolation guarantee
# ───────────────────
# Operationally separate from trading workflows (daily-alpaca-paper.yml,
# alpha_daily.yml).  Failures here never block trading execution.
#
# Email transport: Gmail/SMTP — same rail as all other repo emails.
# Required GitHub Secrets (all pre-existing in this repo):
#   EMAIL_SENDER        — Gmail sender address
#   EMAIL_APP_PASSWORD  — Gmail app password
#   EMAIL_RECIPIENT     — recipient address
#   ENABLE_EMAIL        — set to "0" to disable sending (artifacts still saved)
#
# Research-agent API keys (separate from trading secrets):
#   ANTHROPIC_API_KEY   — Claude scoring
#   FRED_API_KEY        — macro data ingestor

on:
  workflow_dispatch: {}   # manual trigger — run this before first scheduled run to validate

  schedule:
    # 7:00 AM Eastern Time — two cron entries handle DST automatically:
    #   EST (UTC-5, Nov→Mar):  07:00 ET = 12:00 UTC  →  cron "0 12 * * 1-5"
    #   EDT (UTC-4, Mar→Nov):  07:00 ET = 11:00 UTC  →  cron "0 11 * * 1-5"
    - cron: "0 12 * * 1-5"   # 7:00 AM ET (EST, winter)
    - cron: "0 11 * * 1-5"   # 7:00 AM ET (EDT, summer)

jobs:
  digest:
    name: Build + Email Research Digest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Run metadata ──────────────────────────────────────────────────────
      - name: Set run metadata
        id: meta
        shell: bash
        run: |
          set -euxo pipefail
          RUN_DATE="$(date -u +%F)"
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)_digest_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID"     >> "$GITHUB_ENV"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID"     >> "$GITHUB_OUTPUT"
          echo "[META] run_date=$RUN_DATE  run_id=$RUN_ID"

      # ── 3. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 4. Dedup store cache ──────────────────────────────────────────────────
      # Restores seen-IDs JSON so items are not re-surfaced across days.
      # Cache key is date-scoped; restore-keys prefix-match the latest entry
      # (survives weekends without triggering the 7-day eviction window).
      - name: Restore dedup store
        uses: actions/cache@v4
        with:
          path: quant_research_agent/store/seen_ids.json
          key: digest-dedup-v1-${{ steps.meta.outputs.run_date }}
          restore-keys: |
            digest-dedup-v1-

      # ── 5. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: quant_research_agent
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Validate email credentials (non-fatal) ────────────────────────────
      # Warns if secrets are missing so the artifact is still saved even
      # when email cannot be sent.
      - name: Validate email credentials
        shell: bash
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          ENABLE_EMAIL:       ${{ secrets.ENABLE_EMAIL }}
        run: |
          python3 - <<'PY'
          import os
          enable = os.environ.get("ENABLE_EMAIL", "").strip().lower()
          if enable in ("0", "false", "no", "off"):
              print(f"[DIGEST][INFO] ENABLE_EMAIL={enable!r} — email will be skipped; artifacts still saved")
          else:
              required = ["EMAIL_SENDER", "EMAIL_APP_PASSWORD", "EMAIL_RECIPIENT"]
              missing = [k for k in required if not os.environ.get(k, "").strip()]
              if missing:
                  print(f"[DIGEST][WARN] Missing secrets: {missing}")
                  print("[DIGEST][WARN] Email will fail at send time — digest HTML still saved as artifact")
              else:
                  print("[DIGEST][OK] EMAIL_SENDER / EMAIL_APP_PASSWORD / EMAIL_RECIPIENT all present")
          PY

      # ── 7. Run digest pipeline ───────────────────────────────────────────────
      # continue-on-error: true keeps artifact upload alive if the pipeline
      # crashes. main.py is itself non-fatal on email failure (exits 0 and
      # logs a warning), so this only triggers on ingest/analysis crashes.
      - name: Run digest pipeline
        id: run_digest
        working-directory: quant_research_agent
        continue-on-error: true
        shell: bash
        env:
          # Research-agent API keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          # Email — same secrets already used by all trading execution emails
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          ENABLE_EMAIL:       ${{ secrets.ENABLE_EMAIL }}
        run: |
          set -uo pipefail
          OUTPUT_DIR="../outputs/runs/${RUN_ID}"
          mkdir -p "$OUTPUT_DIR"
          # Capture main.py exit code through the tee pipe correctly
          python main.py --output-dir "$OUTPUT_DIR" 2>&1 | tee "$OUTPUT_DIR/digest.log"
          pipeline_exit="${PIPESTATUS[0]}"
          echo "pipeline_exit=$pipeline_exit" >> "$GITHUB_OUTPUT"
          exit "$pipeline_exit"

      # ── 8. Write meta.json ────────────────────────────────────────────────────
      - name: Write run metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path

          run_id   = os.environ["RUN_ID"]
          run_date = os.environ["RUN_DATE"]
          run_dir  = Path("outputs/runs") / run_id
          run_dir.mkdir(parents=True, exist_ok=True)

          meta = {
              "run_id":     run_id,
              "run_date":   run_date,
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "mode":       "research_digest",
              "transport":  "smtp_gmail",
              "git_sha":    os.environ.get("GITHUB_SHA"),
              "workflow_url": (
                  f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}"
                  f"/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
              ),
              "artifacts": {
                  "digest_html": [p.name for p in run_dir.glob("digest_*.html")],
                  "digest_json": [p.name for p in run_dir.glob("digest_*.json")],
              },
          }
          out = run_dir / "meta.json"
          out.write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          print(f"[META] {out}")
          print(json.dumps(meta, indent=2))
          PY

      # ── 9. Upload artifacts ───────────────────────────────────────────────────
      # Runs on success AND failure so the HTML + log are always downloadable.
      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-digest-${{ env.RUN_DATE }}-${{ env.RUN_ID }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            outputs/runs/${{ env.RUN_ID }}/

      # ── 10. Persist dedup store ───────────────────────────────────────────────
      - name: Save dedup store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quant_research_agent/store/seen_ids.json
          key: digest-dedup-v1-${{ steps.meta.outputs.run_date }}
        continue-on-error: true

      # ── 11. Summary ───────────────────────────────────────────────────────────
      - name: Report outcome
        if: always()
        shell: bash
        run: |
          echo "========================================="
          echo " Research Digest — Run Summary"
          echo "========================================="
          echo " Run ID    : $RUN_ID"
          echo " Run date  : $RUN_DATE"
          echo " Pipeline  : ${{ steps.run_digest.outcome }}"
          echo " Transport : Gmail/SMTP"
          echo " Artifacts : outputs/runs/${RUN_ID}/"
          echo "-----------------------------------------"
          ls -lh "outputs/runs/${RUN_ID}/" 2>/dev/null || echo "(no artifact directory)"
          echo "========================================="
